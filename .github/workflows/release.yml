name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.7)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Update system.json version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Update version in system.json
          node -e "
            const fs = require('fs');
            const systemJson = JSON.parse(fs.readFileSync('system.json', 'utf8'));
            systemJson.version = '$VERSION';
            fs.writeFileSync('system.json', JSON.stringify(systemJson, null, 2));
          "
          cat system.json
      
      - name: Create release package
        run: |
          # Create a clean directory for the release
          mkdir -p release/runequest3
          
          # Copy files using find and cp (more portable than rsync)
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -path './node_modules/*' \
            ! -path './release/*' \
            ! -path './memory-bank/*' \
            ! -name '.gitignore' \
            ! -name 'tatus' \
            ! -name 'tatus --porcelain' \
            ! -path './packs/*/LOCK' \
            ! -path './packs/*/LOG*' \
            ! -path './packs/*/MANIFEST-*' \
            ! -path './packs/*/*.ldb' \
            ! -path './packs/*/*.log' \
            ! -path './packs/*/CURRENT' \
            ! -path './packs/*/lost/*' \
            -exec sh -c 'mkdir -p "release/runequest3/$(dirname "$1")" && cp "$1" "release/runequest3/$1"' _ {} \;
          
          # Create the zip file
          cd release
          zip -r ../runequest3-foundry.zip runequest3/
          cd ..
          
          # Also copy system.json to root for manifest
          cp system.json release/system.json
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            runequest3-foundry.zip
            release/system.json
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## RuneQuest 3rd Edition System v${{ steps.version.outputs.version }}
            
            ### Installation
            
            Use this manifest URL in Foundry VTT:
            ```
            https://github.com/${{ github.repository }}/releases/latest/download/system.json
            ```
            
            ### Changes
            
            See the [changelog](https://github.com/${{ github.repository }}/blob/main/README.md#changelog) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
